name: Release & Multi-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================================================================
  # Windows Build (Standalone .exe + NSIS Setup Installer)
  # ================================================================
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI & NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows Executable & NSIS Installer
        shell: pwsh
        run: |
          makensis /VERSION
          wails build -nsis -ldflags "-s -w"

      - name: Rename and Prepare Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path build\bin\gotion.exe) {
            Copy-Item build\bin\gotion.exe dist\gotion-windows-amd64.exe
          }
          if (Test-Path build\bin\gotion-amd64-installer.exe) {
            Copy-Item build\bin\gotion-amd64-installer.exe dist\gotion-windows-amd64-installer.exe
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gotion-windows
          path: dist/*

  # ================================================================
  # Linux Build (AppImage, .deb, .rpm, .tar.gz)
  # ================================================================
  build-linux:
    name: Build Linux (AppImage, Deb, Rpm, Tarball)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-bin \
            ruby \
            ruby-dev \
            rubygems \
            rpm \
            desktop-file-utils \
            curl \
            file
          sudo gem install --no-document fpm

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Linux Native Binary
        run: |
          wails build -platform linux/amd64 -ldflags "-s -w"

      - name: Package Linux Artifacts (.deb, .rpm, .AppImage, .tar.gz)
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi

          # 1. Package .tar.gz
          tar -czf dist/gotion-linux-amd64.tar.gz -C build/bin gotion

          # 2. Prepare Standard Packaging Directory Structure
          mkdir -p pkg-root/usr/bin
          mkdir -p pkg-root/usr/share/applications
          mkdir -p pkg-root/usr/share/icons/hicolor/512x512/apps

          cp build/bin/gotion pkg-root/usr/bin/gotion
          chmod +x pkg-root/usr/bin/gotion

          # Create Desktop Entry
          cat << 'EOF' > pkg-root/usr/share/applications/gotion.desktop
          [Desktop Entry]
          Name=Gotion
          Comment=Ultra-Lightweight Notion Desktop Client
          Exec=gotion %U
          Icon=gotion
          Terminal=false
          Type=Application
          Categories=Office;Productivity;
          MimeType=x-scheme-handler/notion;
          EOF

          # Resize & copy icon
          if [ -f "build/appicon.png" ]; then
            cp build/appicon.png pkg-root/usr/share/icons/hicolor/512x512/apps/gotion.png
          elif [ -f "icon.png" ]; then
            cp icon.png pkg-root/usr/share/icons/hicolor/512x512/apps/gotion.png
          fi

          # 3. Build Debian Package (.deb)
          mkdir -p pkg-deb/DEBIAN
          cp -r pkg-root/usr pkg-deb/
          cat << EOF > pkg-deb/DEBIAN/control
          Package: gotion
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ryandaaa <ryanda.valents3649@student.unri.ac.id>
          Depends: libgtk-3-0, libwebkit2gtk-4.0-37 | libwebkit2gtk-4.1-0
          Description: Ultra-Lightweight Notion Desktop Client powered by Go and WebKitGTK
          EOF
          dpkg-deb --build pkg-deb "dist/gotion_${VERSION}_amd64.deb"

          # 4. Build RPM Package (.rpm)
          fpm -s dir -t rpm \
            -n gotion \
            -v "${VERSION}" \
            --architecture x86_64 \
            --maintainer "ryandaaa" \
            --license "MIT" \
            --description "Ultra-Lightweight Notion Desktop Client" \
            --depends "gtk3" \
            --depends "webkit2gtk4.0" \
            -p "dist/gotion-${VERSION}.x86_64.rpm" \
            -C pkg-root usr

          # 5. Build AppImage
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          cp -r pkg-root/usr AppDir/
          cp pkg-root/usr/share/applications/gotion.desktop AppDir/
          cp pkg-root/usr/share/icons/hicolor/512x512/apps/gotion.png AppDir/gotion.png
          cp AppDir/gotion.png AppDir/.DirIcon

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/gotion" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Download appimagetool with redirect support
          curl -sSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool || \
          curl -sSL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "dist/gotion-${VERSION}-x86_64.AppImage" || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gotion-linux
          path: dist/*

  # ================================================================
  # macOS Build (.app, .dmg, .zip Universal Binary)
  # ================================================================
  build-macos:
    name: Build macOS (Universal .dmg & .zip)
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI & create-dmg
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          brew install create-dmg || true

      - name: Build macOS Universal Bundle
        run: |
          wails build -platform darwin/universal -ldflags "-s -w"

      - name: Package macOS Artifacts (.dmg & .zip)
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi

          # Zip Application Bundle
          ditto -c -k --sequesterRsrc --keepParent build/bin/gotion.app dist/gotion-macos-universal.zip

          # Create DMG Image
          if command -v create-dmg &> /dev/null; then
            create-dmg \
              --volname "Gotion Installer" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --app-drop-link 420 185 \
              "dist/gotion-${VERSION}-macos-universal.dmg" \
              build/bin/gotion.app || true
          fi

          # Fallback to hdiutil if create-dmg was skipped or failed
          if [ ! -f "dist/gotion-${VERSION}-macos-universal.dmg" ]; then
            hdiutil create -volname "Gotion" -srcfolder build/bin/gotion.app -ov -format UDZO "dist/gotion-${VERSION}-macos-universal.dmg"
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gotion-macos
          path: dist/*

  # ================================================================
  # Release Publisher (Aggregates checksums and publishes Release)
  # ================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums (SHA-256)
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
